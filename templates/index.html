<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电商价格对比工具 · 在线演示</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#f5f6fa; color:#2c3e50; }
  header { background: linear-gradient(135deg,#1e3c72,#2a5298); color:#fff; padding:22px 40px; }
  header h1 { margin:0; font-size:24px; }
  header .sub { opacity:.85; font-size:13px; margin-top:4px; }
  .container { max-width:1200px; margin:28px auto; padding:0 20px; }

  .search-bar { background:#fff; border-radius:12px; padding:22px;
                box-shadow:0 2px 12px rgba(0,0,0,.06); margin-bottom:24px; }
  .search-bar h2 { margin:0 0 14px; font-size:16px; color:#1e3c72; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .row input[type=text] { flex:1 1 300px; padding:10px 14px; font-size:15px;
                          border:1px solid #ced4da; border-radius:8px; outline:none; min-width:200px; }
  .row input[type=text]:focus { border-color:#2a5298; }
  .row label { font-size:14px; margin-right:4px; display:flex; align-items:center; gap:4px; }
  .row button { padding:10px 22px; font-size:15px; font-weight:600; color:#fff;
                background: linear-gradient(135deg,#1e3c72,#2a5298); border:none;
                border-radius:8px; cursor:pointer; transition:.2s; }
  .row button:hover { transform: translateY(-1px); box-shadow:0 4px 12px rgba(30,60,114,.3); }
  .row button:disabled { opacity:.6; cursor:not-allowed; }

  .msg { padding:10px 14px; border-radius:8px; margin-top:12px; font-size:14px; display:none; }
  .msg.ok { background:#d4edda; color:#155724; display:block; }
  .msg.err { background:#f8d7da; color:#721c24; display:block; }

  .card { background:#fff; border-radius:12px; padding:22px; box-shadow:0 2px 12px rgba(0,0,0,.06); margin-bottom:24px; }
  .card h2 { margin:0 0 14px; font-size:17px; color:#1e3c72; border-left:4px solid #1e3c72; padding-left:10px; }

  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:16px; }
  .stat-box { background: linear-gradient(135deg,#f8f9fa,#e9ecef); padding:14px; border-radius:10px; }
  .stat-box .plat { font-size:13px; color:#6c757d; font-weight:600; }
  .stat-box .big { font-size:26px; font-weight:700; color:#E1251B; margin-top:4px; }
  .stat-box .meta { font-size:12px; color:#6c757d; margin-top:4px; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:10px 12px; border-bottom:1px solid #eee; text-align:left; }
  th { background:#f8f9fa; font-weight:600; color:#495057; }
  tr:hover { background:#fafcff; }

  .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:500; }
  .bj { background:#E1251B22; color:#E1251B; }
  .tb { background:#FF6A0022; color:#FF6A00; }
  .pdd { background:#E02E2422; color:#E02E24; }
  .all { background:#6c757d22; color:#6c757d; }
  .rec { background:#28a745; color:#fff; }
  .cheap { background:#ffc107; color:#333; }
  .link { color:#2a5298; text-decoration:none; }
  .link:hover { text-decoration:underline; }

  .chart { width:100%; height:360px; }

  .loader { display:none; width:20px; height:20px; border:3px solid #ffffff33;
           border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align:center; color:#adb5bd; font-size:12px; padding:20px; }
</style>
</head>
<body>

<header>
  <h1>🛒 电商价格对比工具</h1>
  <div class="sub">输入关键词 → 自动采集京东/淘宝/拼多多 → 清洗去重 → 横向对比 + 性价比推荐</div>
</header>

<div class="container">

  <!-- 搜索栏 -->
  <div class="search-bar">
    <h2>🔎 现场采集</h2>
    <div class="row">
      <input type="text" id="keyword" placeholder="如：iPhone 15 Pro、联想拯救者、九阳破壁机" value="iPhone 15 Pro">
      <label><input type="checkbox" class="plat" value="jd" checked> 京东</label>
      <label><input type="checkbox" class="plat" value="taobao" checked> 淘宝</label>
      <label><input type="checkbox" class="plat" value="pdd" checked> 拼多多</label>
      <button id="btnRun" onclick="runSearch()">
        <span id="btnText">🚀 开始采集</span>
        <span class="loader" id="btnLoader"></span>
      </button>
      <button onclick="loadDemo()" style="background:#6c757d">🎲 载入演示</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- 汇总统计 -->
  <div class="card">
    <h2>📊 各平台汇总</h2>
    <div class="stats-row" id="statsRow"></div>
    <table>
      <thead><tr>
        <th>平台</th><th>商品数</th><th>最低价</th><th>最高价</th>
        <th>平均价</th><th>中位数</th><th>总销量</th><th>平均评分</th>
      </tr></thead>
      <tbody id="statsTbody"></tbody>
    </table>
  </div>

  <!-- 横向对比 -->
  <div class="card">
    <h2>⚡ 跨平台最低价横向对比</h2>
    <div id="chartCross" class="chart"></div>
    <table style="margin-top:12px">
      <thead><tr>
        <th>平台</th><th>最低价</th><th>商品</th><th>店铺</th><th>评分</th><th>销量</th>
      </tr></thead>
      <tbody id="crossTbody"></tbody>
    </table>
  </div>

  <!-- 价格分布 + 性价比 -->
  <div class="card">
    <h2>📈 价格分布直方图</h2>
    <div id="chartDist" class="chart"></div>
  </div>

  <div class="card">
    <h2>🎯 性价比散点图（越靠左下越优，气泡越大销量越高）</h2>
    <div id="chartScatter" class="chart"></div>
  </div>

  <!-- 全部商品列表 -->
  <div class="card">
    <h2>🏷️ 全部商品（按价格升序）</h2>
    <table>
      <thead><tr>
        <th>#</th><th>平台</th><th>商品名称</th><th>价格</th><th>原价</th>
        <th>店铺</th><th>评分</th><th>销量</th><th>性价比分</th><th>推荐</th>
      </tr></thead>
      <tbody id="itemsTbody"></tbody>
    </table>
  </div>

</div>

<footer>电商价格对比工具 · CLI + Web · 数据仅供参考</footer>

<script>
  // Jinja 注入的初始 demo 数据
  const DEMO = {{ demo_json|safe }};
  const PLATFORM_COLORS = { "jd":"#E1251B", "taobao":"#FF6A00", "pdd":"#E02E24" };
  const PLATFORM_NAMES = { "jd":"京东", "taobao":"淘宝", "pdd":"拼多多" };

  function platformBadge(p){
    const cls = p === 'jd' ? 'bj' : (p === 'taobao' ? 'tb' : (p === 'pdd' ? 'pdd' : 'all'));
    return `<span class="badge ${cls}">${PLATFORM_NAMES[p] || p}</span>`;
  }
  function fmtPrice(v){ return '¥' + Number(v).toFixed(2); }
  function fmtSales(v){
    v = Number(v);
    if (v >= 10000) return (v/10000).toFixed(1) + '万';
    return v.toString();
  }

  function renderAll(d){
    // 标题
    document.querySelector('header .sub').innerHTML =
      `关键词：<b>${d.keyword}</b> &nbsp;|&nbsp; 生成时间：${d.generated_at} &nbsp;|&nbsp; 商品总数：${d.total}`;

    // 汇总卡
    const sr = document.getElementById('statsRow');
    sr.innerHTML = '';
    (d.stats || []).filter(s => s.platform !== 'ALL').forEach(s => {
      sr.innerHTML += `<div class="stat-box">
        <div class="plat">${platformBadge(s.platform)} 最低价</div>
        <div class="big">${fmtPrice(s.price_min)}</div>
        <div class="meta">平均 ${fmtPrice(s.price_avg)} · ${s.count} 件</div>
      </div>`;
    });

    const st = document.getElementById('statsTbody');
    st.innerHTML = '';
    (d.stats || []).forEach(s => {
      st.innerHTML += `<tr>
        <td>${s.platform_name}</td>
        <td>${s.count}</td>
        <td><b>${fmtPrice(s.price_min)}</b></td>
        <td>${fmtPrice(s.price_max)}</td>
        <td>${fmtPrice(s.price_avg)}</td>
        <td>${fmtPrice(s.price_median)}</td>
        <td>${fmtSales(s.sales_total)}</td>
        <td>${s.rating_avg.toFixed(2)}</td>
      </tr>`;
    });

    // cross bar
    const cross = d.cross_compare || [];
    Plotly.purge('chartCross');
    Plotly.newPlot('chartCross', [{
      type: 'bar',
      x: cross.map(c => c.platform_name),
      y: cross.map(c => c.lowest_price),
      text: cross.map(c => fmtPrice(c.lowest_price)),
      textposition: 'outside',
      marker: { color: cross.map(c => PLATFORM_COLORS[c.platform]) },
    }], {
      title: { text: '各平台最低价对比', font:{size:15} },
      yaxis: { title: '价格 (¥)' },
      margin: { t: 50, b: 50, l: 60, r: 30 },
    }, {responsive:true});

    const ct = document.getElementById('crossTbody');
    ct.innerHTML = '';
    cross.forEach(c => {
      ct.innerHTML += `<tr>
        <td>${platformBadge(c.platform)}</td>
        <td><b>${fmtPrice(c.lowest_price)}</b></td>
        <td><a class="link" href="${c.item_url}" target="_blank">${c.item_name}</a></td>
        <td>${c.shop_name || '-'}</td>
        <td>${c.rating}</td>
        <td>${fmtSales(c.sales)}</td>
      </tr>`;
    });

    // 价格分布
    const dist = d.distribution || [];
    Plotly.purge('chartDist');
    Plotly.newPlot('chartDist', [{
      type: 'bar',
      x: dist.map(d => fmtPrice(d.range_start) + '-' + fmtPrice(d.range_end)),
      y: dist.map(d => d.count),
      marker: { color: '#2a5298' },
    }], {
      title: { text: '全局价格区间分布', font:{size:15} },
      xaxis: { title: '价格区间' },
      yaxis: { title: '商品数' },
      margin: { t: 50, b: 80, l: 50, r: 30 },
    }, {responsive:true});

    // scatter
    const items = d.items || [];
    const groups = {};
    items.forEach(it => { (groups[it.platform] = groups[it.platform] || []).push(it); });
    const traces = Object.entries(groups).map(([p, arr]) => ({
      name: PLATFORM_NAMES[p] || p,
      x: arr.map(i => i.price),
      y: arr.map(i => i.rating),
      mode: 'markers',
      marker: {
        color: PLATFORM_COLORS[p],
        size: arr.map(i => Math.max(6, Math.min(30, Math.log10(i.sales+1)*8))),
        opacity: .75,
        line: { width:1, color:'#fff' },
      },
      hovertext: arr.map(i => `${i.name}<br>销量:${fmtSales(i.sales)}<br>性价比:${(i.value_score*100).toFixed(0)}`),
      hoverinfo: 'text+x+y',
    }));
    Plotly.purge('chartScatter');
    Plotly.newPlot('chartScatter', traces, {
      title: { text: '性价比散点图', font:{size:15} },
      xaxis: { title: '价格 (¥)' },
      yaxis: { title: '店铺评分', range: [3.5, 5.05] },
      margin: { t: 50, b: 50, l: 60, r: 30 },
      legend: { orientation: 'h' },
    }, {responsive:true});

    // items table
    const itb = document.getElementById('itemsTbody');
    itb.innerHTML = '';
    items.forEach((it, idx) => {
      const recCls = it.recommend === '性价比推荐' ? 'rec' : (it.recommend === '低价好货' ? 'cheap' : '');
      itb.innerHTML += `<tr>
        <td>${idx+1}</td>
        <td>${platformBadge(it.platform)}</td>
        <td><a class="link" href="${it.url}" target="_blank">${it.name}</a></td>
        <td><b style="color:#E1251B">${fmtPrice(it.price)}</b></td>
        <td style="color:#999;text-decoration:line-through">${it.original_price ? fmtPrice(it.original_price) : '-'}</td>
        <td>${it.shop_name || '-'}</td>
        <td>${it.rating}</td>
        <td>${fmtSales(it.sales)}</td>
        <td>${(it.value_score*100).toFixed(1)}</td>
        <td>${it.recommend ? `<span class="badge ${recCls}">${it.recommend}</span>` : ''}</td>
      </tr>`;
    });
  }

  function showMsg(ok, text){
    const m = document.getElementById('msg');
    m.className = 'msg ' + (ok ? 'ok' : 'err');
    m.textContent = text;
  }

  function getSelectedPlatforms(){
    return Array.from(document.querySelectorAll('.plat:checked')).map(c => c.value);
  }

  async function runSearch(){
    const kw = document.getElementById('keyword').value.trim();
    if (!kw) { showMsg(false, '请输入搜索关键词'); return; }
    const platforms = getSelectedPlatforms();
    if (!platforms.length) { showMsg(false, '至少选择一个平台'); return; }

    const btn = document.getElementById('btnRun');
    const loader = document.getElementById('btnLoader');
    btn.disabled = true; btn.querySelector('#btnText').textContent = '采集中...'; loader.style.display = 'inline-block';
    showMsg(true, '正在采集，请稍候（每个平台约 1-2 秒）...');

    try {
      const resp = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keyword: kw, platforms, max_per_platform: 20 }),
      });
      const json = await resp.json();
      if (!json.ok) throw new Error(json.msg);
      renderAll(json.data);
      showMsg(true, `✅ 采集完成，共 ${json.data.total} 条数据 → 已保存 ${json.saved}`);
    } catch(e) {
      showMsg(false, '❌ ' + e.message);
    } finally {
      btn.disabled = false; btn.querySelector('#btnText').textContent = '🚀 开始采集'; loader.style.display = 'none';
    }
  }

  async function loadDemo(){
    showMsg(true, '载入演示数据...');
    try {
      const resp = await fetch('/api/demo');
      const json = await resp.json();
      if (json.ok) renderAll(json.data);
      showMsg(true, '✅ 演示数据已载入（iPhone 15 Pro 示例）');
    } catch(e) { showMsg(false, e.message); }
  }

  // 回车触发
  document.getElementById('keyword').addEventListener('keydown', e => {
    if (e.key === 'Enter') runSearch();
  });

  // 初始渲染 demo
  renderAll(DEMO);
</script>
</body>
</html>
